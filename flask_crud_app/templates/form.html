{% extends 'base.html' %}
{% block content %}
<section class="panel form-card">
  <h2>{{ title }}</h2>
  <form method="post">
    <label>
      Name
      <input type="text" name="name" value="{{ item.name if item else '' }}" required />
    </label>
    <label>
      Category
      <input type="text" name="category" value="{{ item.category if item else '' }}" required />
    </label>
    <label>
      Status
      <select name="status">
        <option value="Pending" {% if item and item.status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Done" {% if item and item.status == 'Done' %}selected{% endif %}>Done</option>
        <option value="Archived" {% if item and item.status == 'Archived' %}selected{% endif %}>Archived</option>
      </select>
    </label>
    <div class="actions">
      <button class="button primary" type="submit">Save</button>
      <a class="button" href="{{ url_for('list_items') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
